<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="application-name" content="TREINO">
<meta name="description" content="Organize seus treinos, acompanhe sua evolução e registre seu histórico.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Norte Flow — Treino</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#101012;--s2:#1b1b1e;--ln:#28282c;--ink:#f5f5f7;--mu:#8e8e96;--ac:#fff;--on:#000;--sh:0 8px 24px rgba(0,0,0,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f3f3f6;--s1:#fff;--s2:#ecf0f1;--ln:#dcdce3;--ink:#111114;--mu:#6c6c76;--ac:#111114;--on:#fff;--sh:0 6px 20px rgba(20,37,40,.08);color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
[hidden]{display:none!important}
main{max-width:760px;margin:0 auto;padding:16px 16px 130px}
h1{font:700 34px/1.05 "Barlow Condensed",sans-serif;margin:6px 0 4px}
h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0}
h3{font:700 18px "Barlow Condensed",sans-serif;margin:0 0 10px;letter-spacing:.3px}
.mu,small{color:var(--mu)}p{margin:4px 0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--sh)}
.b{border:1px solid var(--ln);background:var(--s2);border-radius:12px;padding:10px 14px;font-weight:600}
.b.pri,.pb{background:var(--ac);color:var(--on);border-color:var(--ac)}
.pb{border:0;border-radius:12px;padding:9px 14px;font-weight:600}
.ib{border:1px solid var(--ln);background:var(--s2);border-radius:10px;min-width:38px;height:38px;padding:0 8px}
.ringrow{display:flex;align-items:center;gap:18px}.ring{width:110px;flex:none}
.rb{fill:none;stroke:var(--s2);stroke-width:9}.rf{fill:none;stroke:var(--ac);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}.rt{fill:var(--ink);font:700 22px "Barlow Condensed",sans-serif}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;text-align:center}.kp b{display:block;font:700 30px "Barlow Condensed",sans-serif}.kp span{font-size:13px;color:var(--mu)}
.nx{display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:5px solid var(--c);padding-left:12px}.nx b{display:block;font-size:19px}
.tp{display:flex;gap:8px}.tp .b{flex:1}
.bars{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:8px;text-align:center}
.bk{height:96px;display:flex;align-items:flex-end}.bk i{display:block;width:100%;position:relative;overflow:hidden;border:1px solid var(--ln);background:var(--s2);border-radius:8px;min-height:5px}.bk u{position:absolute;bottom:0;left:0;right:0;background:var(--ac)}
.bars small{font-size:12px}.bars .v{font:700 15px "Barlow Condensed",sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;margin:10px 0}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on)}
.wn{display:flex;gap:8px;margin:12px 0}.wn button{border:1px solid var(--ln);background:var(--s1);border-radius:12px;padding:9px 14px;font-weight:600}.wn button:nth-child(2){flex:1;text-transform:capitalize}
.dcs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:1px solid var(--ln);background:var(--s1);border-radius:14px}
.dc b{font:700 20px "Barlow Condensed",sans-serif}.dc small{font-size:12px}
.dc[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}.dc[aria-pressed="true"] small{color:var(--on)}
[data-today]{outline:1.5px dashed var(--mu);outline-offset:2px}
.dots{display:flex;gap:3px;height:8px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid;display:block}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mg>small{text-align:center;font-size:12px}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;min-height:56px;border:1px solid var(--ln);background:var(--s1);border-radius:12px}.mc.off{opacity:.35}.mc b{font-weight:600;font-size:14px}.mc .dots{flex-wrap:wrap;height:auto;max-width:36px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.ss{background:var(--s1);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--sh)}
.sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}.tx{min-width:0}.tx b{display:block;font-size:17px;overflow-wrap:anywhere}
.bd{font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:2px 9px;white-space:nowrap;color:var(--mu)}
.ss.d .bd{background:var(--ac);color:var(--on);border-color:var(--ac)}.ss.d .tx b{text-decoration:line-through;opacity:.6}.ss.c{opacity:.55}
.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ac .b{padding:8px 12px;font-size:14px}
.dt{margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}.er{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.er:last-child{border:0}.er span{flex:1;font-weight:500}
.empty{text-align:center;padding:24px 16px;border:1px dashed var(--ln);border-radius:16px;margin:10px 0;color:var(--mu)}.empty b{color:var(--ink);display:block;font-size:17px}.empty .b{margin-top:10px}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mets b{display:block;font:700 30px "Barlow Condensed",sans-serif}
.pg{height:8px;background:var(--s2);border-radius:8px;overflow:hidden;margin-top:8px}.pg i{display:block;height:100%;background:var(--ac)}
.ln{width:100%;height:auto;color:var(--ink);margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.bg{border:1px solid var(--ln);border-radius:14px;padding:12px;font-weight:600;font-size:14px}.bg.off{opacity:.35}
.hr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.hr:last-child{border:0}.hr span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.cd{width:10px;height:10px;border-radius:50%;flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.xr{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;margin:8px 0;padding:8px;border:1px solid var(--ln);border-radius:12px}.xr .xn{grid-column:1/-1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;margin-top:16px}.row .b{flex:1}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--s1);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
#nav button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);font-size:12px;padding:6px 0;border-radius:12px}
#nav button[aria-current="true"]{color:var(--ink);background:var(--s2)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);border-radius:30px;padding:6px 8px 6px 18px;display:flex;align-items:center;gap:8px;z-index:25;box-shadow:var(--sh)}
#timer b{font:700 26px "Barlow Condensed",sans-serif}#timer .ib{color:var(--ink)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ac);color:var(--on);padding:10px 16px;border-radius:30px;font-weight:600;z-index:40;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* TREINO — FUTURISTA MINIMALISTA / JIU-JITSU */
:root{
 --bg:#050505;--s1:#0d0d0f;--s2:#171719;--ln:#28282b;
 --ink:#f5f5f5;--mu:#85858b;--ac:#f4f4f4;--on:#050505;
 --sh:0 14px 34px rgba(0,0,0,.34);
}
:root[data-theme="light"]{
 --bg:#f4f4f4;--s1:#fff;--s2:#ededed;--ln:#d7d7d7;
 --ink:#111;--mu:#6d6d72;--ac:#111;--on:#fff;
}
body{letter-spacing:.01em;background:
 radial-gradient(ellipse at 50% -15%,rgba(255,255,255,.045),transparent 45%),
 var(--bg)}
main{padding:18px 15px 138px}
#view::before{content:"JIU-JITSU  /  DISCIPLINA  /  EVOLUÇÃO";display:block;font:600 10px/1.2 Barlow,sans-serif;letter-spacing:.22em;color:var(--mu);margin:2px 0 12px}
h1{font-size:36px;letter-spacing:-.025em;margin:0 0 6px}
h1::after{content:"";display:block;width:38px;height:2px;background:var(--ink);opacity:.7;margin-top:10px}
h2{font-size:26px;letter-spacing:-.01em}
h3{font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.card{border-radius:18px;background:linear-gradient(145deg,var(--s1),color-mix(in srgb,var(--s1) 92%,var(--ink) 8%));border-color:color-mix(in srgb,var(--ln) 70%,var(--ink) 12%);padding:17px;margin:12px 0}
.b,.pb,.ib{transition:transform .12s ease,background .16s ease,border-color .16s ease}
.b{border-radius:11px;background:var(--s2);border-color:var(--ln)}
.b.pri,.pb{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b:active,.pb:active,.ib:active{transform:scale(.97)}
.ib{background:#101012;border-color:#2b2b2e;color:#e9e9e9;border-radius:11px}
.ring{width:106px}
.rb{stroke:#242427}.rf{stroke:var(--ink)}
.kp b{font-size:32px;letter-spacing:-.03em}
.nx{border-left-width:2px;border-left-color:var(--ink)!important;padding-left:14px}
.nx b{font-size:20px;letter-spacing:-.01em}
.seg{background:var(--s1);border-color:var(--ln);border-radius:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wn button{border-radius:11px;background:var(--s1);border-color:var(--ln)}
.dc,.mc{background:var(--s1);border-radius:12px;border-color:var(--ln)}
.dc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ss{border-left-width:2px;border-radius:15px;background:var(--s1);border-color:var(--ln);border-left-color:var(--ink)!important}
.ss .bd{border-radius:7px;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.ss.d .bd{background:var(--ink);color:var(--bg)}
.mets b{font-size:34px;letter-spacing:-.025em}
.pg{height:5px;background:var(--s2)}.pg i{background:var(--ink)}
.bg{border-radius:12px;background:var(--s1);border-color:var(--ln)}
input,select,textarea{background:var(--s2);border-color:var(--ln);border-radius:11px}
#nav{background:rgba(10,10,10,.94);border-top-color:#262629;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:8px}
:root[data-theme="light"] #nav{background:rgba(255,255,255,.94)}
#nav button{font-size:11px;letter-spacing:.04em}
#nav button[aria-current="true"]{color:var(--ink);background:var(--s2)}
#timer{box-shadow:0 12px 34px rgba(255,255,255,.08)}
.sheet{border-radius:22px 22px 0 0;background:var(--s1);border-color:var(--ln)}
#toast{border:1px solid var(--ln)}
@media(min-width:600px){main{padding-top:24px}.card{padding:20px}}


/* TREINO CYBERPUNK UI — camada visual, sem alterar regras de treino */
:root{--bg:#05090a;--s1:#0a1415;--s2:#102225;--ln:#26464b;--ink:#f1fafb;--mu:#8bafb4;--ac:#46b8c9;--on:#030809;--sh:0 0 26px rgba(57,179,198,.06);color-scheme:dark}
:root[data-theme="light"]{--bg:#edf7f8;--s1:#fff;--s2:#e8f5f7;--ln:#b8d9de;--ink:#12272a;--mu:#5b7f84;--ac:#2b8592;--on:#fff;--sh:0 6px 22px rgba(29,90,99,.10);color-scheme:light}
body{background:radial-gradient(ellipse at 50% -15%,rgba(40,125,138,.18),transparent 55%),var(--bg);font-family:Barlow,system-ui,sans-serif}
main{padding-top:12px}
.card{background:linear-gradient(145deg,rgba(11,25,27,.97),rgba(6,13,14,.98));border:1px solid #1d4045;border-radius:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 0 22px rgba(57,179,198,.045);position:relative;overflow:hidden}
:root[data-theme="light"] .card{background:linear-gradient(145deg,#fff,#f3fbfc)}
h1{font-size:32px;letter-spacing:.04em;text-transform:uppercase}
h2{letter-spacing:.03em}
h3{color:#c8eaef;letter-spacing:.12em;text-transform:uppercase}
.b,.pb,.ib{border-radius:10px;transition:transform .15s,box-shadow .15s}
.b{background:#11272a;border-color:#2a545b;color:#e2f4f6}
.b.pri,.pb{background:linear-gradient(110deg,#39b3c6,#54bdce);color:#040d0f;border:0;box-shadow:0 0 15px rgba(57,179,198,.28);font-weight:800}
.b:active,.pb:active,.ib:active{transform:scale(.97)}
.ib{background:#0c1f22;border-color:#274e54;color:#edf8fa}
.rf{stroke:#39b3c6;filter:drop-shadow(0 0 4px #39b3c6)}.rb{stroke:#1b3c41}.rt{fill:var(--ink)}
.kp b{font-size:30px;color:#eef8fa;text-shadow:0 0 12px rgba(57,179,198,.18)}
.kp span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.nx{border-left:2px solid #39b3c6!important;background:linear-gradient(90deg,rgba(57,179,198,.08),transparent);padding:12px 14px;border-radius:0 12px 12px 0}
.seg,.dc,.mc,.ss,.bg{background:var(--s1);border-color:var(--ln)}
.seg button[aria-pressed="true"],.dc[aria-pressed="true"]{background:linear-gradient(110deg,#39b3c6,#54bdcd);color:#07171a;border-color:#39b3c6}
.ss{border-left:2px solid var(--c)!important;border-radius:13px;box-shadow:inset 0 0 14px rgba(57,179,198,.035)}
.ss .bd{border-radius:7px;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.pg{background:#173337}.pg i{background:linear-gradient(90deg,#39b3c6,#ec5864)}
input,select,textarea{background:var(--s2);border-color:#264d53;border-radius:10px}
#nav{background:rgba(4,12,13,.94);border-top:1px solid #20474d;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:8px}
:root[data-theme="light"] #nav{background:rgba(247,252,253,.95)}
#nav button[aria-current="true"]{color:#39b3c6;background:rgba(57,179,198,.10);text-shadow:0 0 10px rgba(57,179,198,.35)}
#nav button{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#timer{border:1px solid #24707b;box-shadow:0 0 25px rgba(57,179,198,.15)}
.sheet{border-radius:22px 22px 0 0;background:var(--s1);border-color:var(--ln)}
#toast{border:1px solid #276f7a;box-shadow:0 0 16px rgba(57,179,198,.12)}
.cy-hero{padding:16px 16px 21px;margin:0 0 14px;border:1px solid #1d5159;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 38%,rgba(233,52,67,.22),transparent 44%),radial-gradient(ellipse at 18% 70%,rgba(57,179,198,.16),transparent 45%),linear-gradient(145deg,#071011,#05090a 72%);box-shadow:0 0 24px rgba(57,179,198,.07)}

.cy-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.cy-mark{font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.12em;color:#f3fbfc}.cy-mark span{font-size:10px;color:#82b0b7;letter-spacing:.2em}
.cy-live{font:600 9px system-ui;letter-spacing:.12em;color:#78cbd8;display:flex;align-items:center;gap:6px}.cy-live i,.cy-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#39b3c6;box-shadow:0 0 8px #39b3c6}
.cy-hero-main{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:28px 0 5px}
.cy-eyebrow{font:600 10px system-ui;letter-spacing:.17em;color:#8bbcc4;margin-bottom:8px}
.cy-hero h1{font:800 28px/1.05 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.08em;text-shadow:0 0 18px rgba(57,179,198,.12)}.cy-hero h1 em{font-style:normal;color:#39b3c6}

.cy-section{font:700 10px system-ui;letter-spacing:.16em;color:#74cad7;margin-bottom:12px}.cy-next{border-color:#23575f}.cy-next .nx{margin-top:3px}.cy-button{letter-spacing:.06em;font-size:11px}
.cy-week .bars .bk{background:#10272a;border:1px solid #214a50;border-radius:6px;overflow:hidden}.cy-week .bars .bk i{background:linear-gradient(180deg,#3aa5b6,#236d78);box-shadow:0 0 10px rgba(57,179,198,.2)}.cy-week .bars .bk u{background:#52bccd}
.cy-rest .tp{gap:8px}
@media(min-width:600px){.cy-hero{padding:22px}.cy-hero h1{font-size:36px}.cy-gi{font-size:96px}}


/* NORTE FLOW — paleta da equipe */
:root{--bg:#050607;--s1:#0b0f10;--s2:#121a1c;--ln:#1f2d30;--ink:#f4f8f8;--mu:#8a9fa3;--ac:#3aa6b6;--on:#021014;--red:#e0313f}
:root[data-theme="light"]{--bg:#eef3f4;--s1:#fff;--s2:#e6eef0;--ln:#c4d4d7;--ink:#101a1c;--mu:#5a6f73;--ac:#1f7482;--on:#fff}
main{position:relative}
.bc{position:absolute;top:12px;right:14px;width:46px;height:auto;border-radius:10px;border:1px solid var(--ln);background:#000}
.cy-logo{width:84px;height:auto;flex:none;border-radius:14px;border:1px solid #1f3a40;background:#000;box-shadow:0 0 18px rgba(58,166,182,.2)}
.cy-lines{background:linear-gradient(90deg,#3aa6b6,var(--red),transparent)}
.gl{stroke:var(--ln);stroke-width:1}.ax{fill:var(--mu);font:10px Barlow,sans-serif}.cv{fill:var(--ink);font:700 12px "Barlow Condensed",sans-serif}
.wb{cursor:pointer}.wb .hit{fill:transparent}
.body{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}.body svg{width:100%;height:auto;max-height:430px}
.sil{fill:none;stroke:var(--ln);stroke-width:1.5}
.mz{cursor:pointer;stroke:var(--ln);stroke-width:1.2}.mz:focus-visible,.mz.sel{stroke:var(--ink);stroke-width:2.4;outline:0}
.lg{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--s2),var(--ac));margin:10px 0 4px}
.dn{display:flex;align-items:center;gap:16px}.dn svg{width:120px;flex:none}.dl{flex:1;display:grid;gap:6px;font-size:14px}.dl div{display:flex;align-items:center;gap:8px}.dl small{margin-left:auto}
.vit svg{width:100%;height:auto;max-height:460px;display:block;margin:0 auto}.vfr,.vdt{pointer-events:none}.vdt{fill:none;stroke:var(--bg);stroke-width:1.1;opacity:.5}
.rd .ph{text-align:center;font:700 12px system-ui;letter-spacing:.18em;color:#74cad7}
.rd .big{font:700 88px/1 "Barlow Condensed",sans-serif;text-align:center;letter-spacing:.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.rd.rest .ph,.rd.rest .big{color:#ffb020}.rd.last .big{color:#ff5a4d}
.rd .chips{display:flex;gap:8px;margin:6px 0 10px}.rd .chips .b{flex:1;padding:8px 0}
.rd .b[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}.rd button:disabled{opacity:.4}
#rdfs{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center}
#rdfs .fp{font:700 16px system-ui;letter-spacing:.26em;color:#74cad7}#rdfs .ft{font:700 min(32vw,38vh)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:#fff}#rdfs .fr{font:600 24px Barlow,system-ui,sans-serif;color:#8e8e96}
#rdfs .fb{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}#rdfs .fb .b{min-width:110px;padding:14px 18px;font-weight:700;letter-spacing:.06em}
#rdfs.rest .fp,#rdfs.rest .ft{color:#ffb020}#rdfs.last{background:#2a0705}#rdfs.last .ft,#rdfs.last .fp{color:#ff5a4d}
</style>
</head>
<body>
<main id="view"></main>
<div id="timer" hidden></div>
<div id="rdfs" hidden></div>
<nav id="nav" aria-label="Navegação principal">
<button data-a="tab" data-t="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
<button data-a="tab" data-t="ag"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
<button data-a="tab" data-t="ev"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Evolução</button>
<button data-a="tab" data-t="aj"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const K="treino-semanal-v3",OLD="treino-semanal-v2";
const CATS={"Jiu-Jitsu":"#3fb0c0","Luta livre":"#ff5a4d","Preparação física":"#ffb020","Cardio":"#3ddc84","Musculação":"#b38cff","Corrida":"#d9d9d9","Funcional":"#ff7ac6","Mobilidade":"#c9d65a","Outro":"#9a9a9a"};
const INT=["","Leve","Moderada","Alta"],DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"],AB=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const pad=n=>String(n).padStart(2,"0"),uid=()=>Math.random().toString(36).slice(2,9);
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{let[a,b,c]=s.split("-");return new Date(a,b-1,c)};
const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{let x=new Date(d);x.setHours(0,0,0,0);return add(x,-((x.getDay()+6)%7))};
const wd=d=>(d.getDay()+6)%7;
const num=v=>parseFloat(String(v).replace(",","."))||0;
const fm=m=>m>=60?Math.floor(m/60)+"h"+(m%60?pad(m%60):""):m+" min";
const fd=k=>k.slice(8)+"/"+k.slice(5,7);
let S,E=null,CB=null,T=null;
const CFG=window.NF_CLOUD||{},CLOUD=!!(window.supabase&&/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(CFG.url||"")&&(CFG.key||"").length>20),sb=CLOUD?window.supabase.createClient(CFG.url,CFG.key):null;
let U=null,READY=!CLOUD,SY=0,pt=null;
const VER="2026-11-21b",WHY=CLOUD?"":!window.supabase?"a biblioteca da nuvem não carregou":!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(CFG.url||"")?"a URL no config.js não está certa":"a chave no config.js não está certa";
let V={tab:"home",mode:"sem",week:mon(new Date()),sel:ds(new Date()),month:new Date(),open:null,ex:"",wi:7,mu:""};
const done=k=>Object.values(S.log[k]||{}).filter(e=>e.s=="d");
const clone=o=>JSON.parse(JSON.stringify(o));

function load(){
  try{let r=localStorage.getItem(K);if(r){let p=JSON.parse(r);if(p&&p.plan){S=p;return}}}catch(e){}
  S={plan:[[],[],[],[],[],[],[]],log:{},name:"",theme:"dark",goal:0,best:0};
  try{let o=JSON.parse(localStorage.getItem(OLD)||"null");
    if(o&&o.days&&o.days.length==7){let m=mon(new Date());
      o.days.forEach((d,i)=>d.forEach(x=>{
        let s={id:uid(),t:CATS[x.t]?x.t:"Outro",n:"",h:x.h||"",d:x.d||"",o:x.o||"",i:"",ex:[]};
        S.plan[i].push(s);
        if(x.done){let k=ds(add(m,i));(S.log[k]=S.log[k]||{})[s.id]={s:"d",t:s.t,n:"",m:num(s.d),ex:[]}}
      }))}}catch(e){}
  store();
}
function store(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("Não foi possível salvar neste aparelho. Faça um backup.")}}
function save(){S.ts=Date.now();store();sched()}
const hasData=()=>S.plan.some(a=>a.length)||Object.keys(S.log).length>0;
function sched(){if(!CLOUD||!U)return;clearTimeout(pt);pt=setTimeout(push,1500)}
function syText(){return SY>0?"Sincronizado às "+new Date(SY).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):SY<0?"Sem conexão: será enviado quando possível":"Ainda não sincronizado"}
function setSync(){let e=$("#sy");if(e)e.textContent=syText()}
async function push(){if(!CLOUD||!U)return;try{let{error}=await sb.from("app_state").upsert({user_id:U.id,data:S,updated_at:new Date().toISOString()});if(error)throw error;SY=Date.now()}catch(e){SY=-1}setSync()}
async function pull(){
  if(!CLOUD||!U)return;
  try{
    let{data,error}=await sb.from("app_state").select("data").eq("user_id",U.id).maybeSingle();
    if(error)throw error;
    let c=data&&data.data,lt=S.ts||0;
    if(!c){if(hasData()){S.ts=lt||Date.now();store();await push()}else{SY=Date.now();setSync()}return}
    if(!Array.isArray(c.plan)||c.plan.length!=7||typeof c.log!="object")throw 0;
    let ct=c.ts||0;
    if(ct>lt){if(hasData()&&!lt){try{localStorage.setItem(K+"-pre-nuvem",JSON.stringify(S))}catch(e){}}
      S=c;S.uid=U.id;store();render();SY=Date.now();setSync();toast("Dados atualizados da nuvem")}
    else if(lt>ct)await push();
    else{SY=Date.now();setSync()}
  }catch(e){SY=-1;setSync()}
}
function adopt(){if(S.uid&&S.uid!=U.id){try{localStorage.removeItem(K)}catch(e){}load()}S.uid=U.id;store()}
async function boot(){if(!CLOUD)return;try{let{data}=await sb.auth.getSession();U=data.session?data.session.user:null}catch(e){}READY=true;if(U)adopt();render();pull()}
function Login(){return `<section class="card" style="margin-top:40px;text-align:center"><img src="logo.png" alt="Norte Flow Jiu-Jitsu" width="96" style="border-radius:14px;background:#000"><h2 style="margin:12px 0 4px">Entrar</h2><p class="mu">Use o e-mail e a senha que você recebeu do professor.</p><label for="lg-e" style="text-align:left">E-mail</label><input id="lg-e" type="email" autocomplete="username" inputmode="email"><label for="lg-p" style="text-align:left">Senha</label><input id="lg-p" type="password" autocomplete="current-password"><div class="row"><button class="b pri" data-a="login">Entrar</button></div></section>`}
function Conta(){
  if(!CLOUD)return `<section class="card"><h3>Conta</h3><p class="mu">Nuvem desligada: ${WHY}. Os dados ficam só neste aparelho.</p><p class="mu" style="font-size:12px">Versão ${VER}</p></section>`;
  return `<section class="card"><h3>Conta e nuvem</h3><p>${esc(U&&U.email)}</p><p class="mu" id="sy">${syText()}</p><p class="mu" style="font-size:12px">Versão ${VER}</p><div class="row"><button class="b" data-a="sync">Sincronizar agora</button><button class="b" data-a="logout">Sair</button></div><label for="np">Nova senha</label><input id="np" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"><div class="row"><button class="b" data-a="pw">Trocar senha</button></div></section>`}
function find(id){for(let i=0;i<7;i++){let x=S.plan[i].find(y=>y.id==id);if(x)return[i,x]}}
function wk(m){let pl=0,dn=0,cn=0,min=0;
  for(let i=0;i<7;i++){pl+=S.plan[i].length;Object.values(S.log[ds(add(m,i))]||{}).forEach(e=>{if(e.s=="d"){dn++;min+=e.m}else cn++})}
  pl=Math.max(pl,dn+cn);return{pl,dn,cn,pe:pl-dn-cn,min}}
function streak(){let d=new Date(),n=0,t=ds(d);d.setHours(0,0,0,0);
  for(let i=0;i<400;i++,d=add(d,-1)){let k=ds(d);if(done(k).length)n++;else if(k!=t&&S.plan[wd(d)].length)break}return n}
function next(){let now=new Date(),t=pad(now.getHours())+":"+pad(now.getMinutes());
  for(let i=0;i<7;i++){let d=add(now,i),k=ds(d),l=S.plan[wd(d)].filter(x=>!S.log[k]?.[x.id]&&(i>0||!x.h||x.h>=t));if(l.length)return{d,k,x:l[0],i}}return null}

/* ---------- telas ---------- */
function Home(){
  let m=mon(new Date()),w=wk(m),h=new Date().getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite",C=2*Math.PI*44,pct=w.pl?Math.round(w.dn/w.pl*100):0,nx=next();
  let mx=Math.max(1,...S.plan.map(a=>a.length));
  let bars=AB.map((a,i)=>{let p=S.plan[i].length,n=done(ds(add(m,i))).length;
    return `<div><div class="bk"><i style="height:${p/mx*100}%"><u style="height:${p?Math.min(1,n/p)*100:0}%"></u></i></div><small>${a}</small></div>`}).join("");
  return `<header class="cy-hero"><div class="cy-top"><span class="cy-mark">TREINO<span> / NORTE FLOW</span></span><span class="cy-live"><i></i> SISTEMA ATIVO</span></div><div class="cy-hero-main"><div><div class="cy-eyebrow">${g.toUpperCase()}${S.name?", "+esc(S.name).toUpperCase():""}</div><h1>DISCIPLINA<br><em>É O CAMINHO.</em></h1><p class="cy-date">${esc(new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}))}</p></div><img class="cy-logo" src="logo.png" alt="Norte Flow Jiu-Jitsu" width="84" height="79"></div><div class="cy-lines"></div></header>
  <section class="card cy-stats"><div class="ringrow"><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${pct}% da semana concluído"><circle cx="50" cy="50" r="44" class="rb"/><circle cx="50" cy="50" r="44" class="rf" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" class="rt">${pct}%</text></svg>
  <div class="kp"><div><b>${w.dn}</b><span>Concluídos</span></div><div><b>${w.pe}</b><span>Pendentes</span></div><div><b>${streak()}</b><span>Sequência</span></div></div></div>
  <p class="mu cy-caption">${w.pl?`SEMANA: ${w.dn} / ${w.pl} SESSÕES · ${w.min?fm(w.min):"0 MIN"} ATIVOS`:"SEM TREINOS PROGRAMADOS ESTA SEMANA."}</p></section>
  <section class="card cy-next"><div class="cy-section"><span class="cy-pulse"></span> PRÓXIMA MISSÃO</div>${nx?`<div class="nx" style="--c:${CATS[nx.x.t]||"#999"}"><div><small>${nx.i==0?"Hoje":nx.i==1?"Amanhã":DAYS[wd(nx.d)]}${nx.x.h?" às "+esc(nx.x.h):""}</small><b>${esc(nx.x.n||nx.x.t)}</b><small>${esc(nx.x.t)}${nx.x.d?" · "+esc(nx.x.d)+" min":""}</small></div><button class="b pri cy-button" data-a="goto" data-k="${nx.k}">ACESSAR ↗</button></div>`:`<div class="empty"><b>Nenhum treino pendente</b><p>Monte seu cronograma na aba Agenda.</p><button class="b pri" data-a="tab" data-t="ag">Abrir agenda</button></div>`}</section>
  <section class="card cy-week"><div class="cy-section">// STATUS DA SEMANA</div><div class="bars">${bars}</div><p class="mu" style="margin-top:8px;font-size:13px">Barra vazia: treinos programados. Preenchida: concluídos.</p></section>
  <section class="card cy-rest"><div class="cy-section">// TIMER DE RECUPERAÇÃO</div><div class="tp">${[30,60,90,120].map(s=>`<button class="b cy-button" data-a="tm" data-s="${s}">${s}s</button>`).join("")}</div></section>${Rounds()}`;
}

function Agenda(){
  return `<h1>Agenda</h1><div class="seg"><button data-a="mode" data-m="sem" aria-pressed="${V.mode=="sem"}">Semana</button><button data-a="mode" data-m="mes" aria-pressed="${V.mode=="mes"}">Mês</button></div>`+(V.mode=="sem"?Sem():Mes());
}
function dots(p,k){return p.slice(0,4).map(x=>{let s=S.log[k]?.[x.id]?.s,c=CATS[x.t]||"#999";return `<i style="background:${s=="d"?c:"transparent"};border-color:${c};opacity:${s=="c"?.3:1}"></i>`}).join("")}
function Sem(){
  let m=V.week,e=add(m,6),tk=ds(new Date());
  let lab=`${m.getDate()} ${m.toLocaleDateString("pt-BR",{month:"short"})} – ${e.getDate()} ${e.toLocaleDateString("pt-BR",{month:"short"})}`;
  let chips=AB.map((a,i)=>{let d=add(m,i),k=ds(d);
    return `<button class="dc" data-a="sel" data-k="${k}" aria-pressed="${k==V.sel}" aria-label="${DAYS[i]} ${d.getDate()}"${k==tk?" data-today":""}><small>${a}</small><b>${d.getDate()}</b><span class="dots">${dots(S.plan[i],k)}</span></button>`}).join("");
  return `<div class="wn"><button data-a="wk" data-n="-1" aria-label="Semana anterior">‹</button><button data-a="today" aria-label="Voltar para hoje">${lab}</button><button data-a="wk" data-n="1" aria-label="Próxima semana">›</button></div><div class="dcs">${chips}</div>${Day(V.sel)}`;
}
function Day(k){
  let d=pd(k),i=wd(d),l=S.plan[i];
  return `<div class="dh"><div><h2>${DAYS[i]}</h2><p class="mu">${esc(d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"}))}${k==ds(new Date())?" · hoje":""} · ${l.length?l.length+" treino"+(l.length>1?"s":""):"descanso"}</p></div><button class="pb" data-a="new" data-d="${i}">+ Treino</button></div>`+
  (l.length?l.map(x=>Sess(x,k)).join(""):`<div class="empty"><b>Dia de descanso</b><p>Recuperar também faz parte do treino. Se quiser, adicione uma sessão.</p></div>`);
}
function Sess(x,k){
  let e=S.log[k]?.[x.id],s=e?.s||"p",c=CATS[x.t]||"#999",meta=[x.h,x.d&&x.d+" min",x.i].filter(Boolean).join(" · ");
  let st=(v,a,b)=>`<button class="b${v=="d"?" ok":""}" data-a="st" data-k="${k}" data-id="${x.id}" data-s="${v}">${s==v?b:a}</button>`;
  return `<article class="ss ${s}" style="--c:${c}"><div class="sh" data-a="open" data-id="${x.id}"><div class="tx"><b>${esc(x.n||x.t)}</b><small>${esc(x.t)}${meta?" · "+esc(meta):""}</small></div><span class="bd">${{p:"Pendente",d:"Concluído",c:"Cancelado"}[s]}</span></div>
  <div class="ac">${st("d","Concluir","Desfazer")}${st("c","Cancelar","Reativar")}<button class="ib" data-a="ed" data-id="${x.id}" aria-label="Editar">✎</button><button class="ib" data-a="dup" data-id="${x.id}" aria-label="Duplicar">⧉</button><button class="ib" data-a="up" data-id="${x.id}" aria-label="Mover para cima">▲</button><button class="ib" data-a="down" data-id="${x.id}" aria-label="Mover para baixo">▼</button><button class="ib" data-a="del" data-id="${x.id}" aria-label="Excluir">🗑</button></div>${V.open==x.id?Det(x):""}</article>`;
}
function Det(x){
  return `<div class="dt">${x.o?`<p>${esc(x.o)}</p>`:""}${x.ex.length?x.ex.map(e=>`<div class="er"><span>${esc(e.n)}</span><small>${esc([e.s&&e.r?e.s+"×"+e.r:(e.s||e.r),e.w&&e.w+" kg"].filter(Boolean).join(" · "))}</small>${num(e.rest)?`<button class="ib" data-a="tm" data-s="${num(e.rest)}" aria-label="Iniciar descanso">⏱ ${num(e.rest)}s</button>`:""}</div>`).join(""):`<p class="mu">Sem exercícios cadastrados. Toque em editar para adicionar.</p>`}</div>`;
}
function Mes(){
  let M=V.month,y=M.getFullYear(),mo=M.getMonth(),f=new Date(y,mo,1),first=wd(f),n=Math.ceil((first+new Date(y,mo+1,0).getDate())/7)*7,st=add(f,-first),tk=ds(new Date()),c="";
  for(let i=0;i<n;i++){let d=add(st,i),k=ds(d);c+=`<button class="mc${d.getMonth()==mo?"":" off"}" data-a="pick" data-k="${k}" aria-label="${d.getDate()} de ${d.toLocaleDateString("pt-BR",{month:"long"})}"${k==tk?" data-today":""}><b>${d.getDate()}</b><span class="dots">${dots(S.plan[i%7],k)}</span></button>`}
  return `<div class="wn"><button data-a="mm" data-n="-1" aria-label="Mês anterior">‹</button><button data-a="today">${esc(M.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}))}</button><button data-a="mm" data-n="1" aria-label="Próximo mês">›</button></div><div class="mg">${AB.map(a=>`<small>${a}</small>`).join("")}${c}</div><p class="mu" style="font-size:13px;margin-top:10px">Ponto cheio: concluído. Ponto vazio: programado. Toque em um dia para abrir.</p>`;
}
function Line(p){
  let W=320,H=140,L=38,R=10,T=12,B=22,v=p.map(a=>a.w),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
  let x=i=>L+(p.length>1?i/(p.length-1):.5)*(W-L-R),y=w=>T+(H-T-B)*(1-(w-lo)/r),g="";
  [hi,(hi+lo)/2,lo].forEach(w=>g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}"/><text class="ax" x="${L-5}" y="${y(w)+3}" text-anchor="end">${+w.toFixed(1)}</text>`);
  let pr=p.findIndex(a=>a.w==hi);
  return `<svg viewBox="0 0 ${W} ${H}" class="ln" role="img" aria-label="Evolução de carga">${g}<polyline points="${p.map((a,i)=>x(i)+","+y(a.w)).join(" ")}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${p.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a.w)}" r="${i==pr?5:3.5}" style="fill:${i==pr?"var(--red)":"var(--ac)"}"/>`).join("")}<text class="cv" x="${x(pr)}" y="${y(hi)-9}" text-anchor="middle" style="fill:var(--red)">recorde</text><text class="ax" x="${L}" y="${H-6}">${fd(p[0].k)}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${fd(p[p.length-1].k)}</text></svg>`;
}
function WkChart(W,m){
  let w=320,h=140,L=24,R=6,T=16,B=22,n=W.length,mx=Math.max(1,S.goal||0,...W.map(x=>Math.max(x.pl,x.dn))),bw=(w-L-R)/n,y=v=>T+(h-T-B)*(1-v/mx),s="";
  [0,mx].forEach(v=>s+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`);

function rdraw(){rfsUpd();let c=$("#rd");if(!c)return;c.className=rcls();$("#rd-t").textContent=rfmt(R.left);$("#rd-p").textContent=rph();$("#rd-r").textContent=rrt();$("#rd-go").textContent=rgt()}
function beep(f,ms,t){try{R.ac=R.ac||new(window.AudioContext||window.webkitAudioContext)();let a=R.ac,o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(t||0);o.type="sine";o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.7,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+ms/1000);o.start(s);o.stop(s+ms/1000+.05)}catch(e){}}
function bell(n){for(let i=0;i<n;i++)beep(i?880:1046,380,i*.5);try{navigator.vibrate&&navigator.vibrate(n>1?[300,120,300,120,300]:[500])}catch(e){}}
async function wlock(on){try{if(on&&navigator.wakeLock&&!R.wl){R.wl=await navigator.wakeLock.request("screen");R.wl.addEventListener("release",()=>{R.wl=null})}else if(!on&&R.wl){let w=R.wl;R.wl=null;await w.release()}}catch(e){R.wl=null}}
function rstart(){if(R.ph=="idle"||R.ph=="done"){R.ph="fight";R.r=1;R.left=R.d;bell(1)}else beep(1,1,0);R.end=Date.now()+R.left*1000;R.run=true;clearInterval(R.iv);R.iv=setInterval(rtick,250);wlock(true);rdraw()}
function rpause(){R.left=Math.max(0,Math.ceil((R.end-Date.now())/1000));R.run=false;clearInterval(R.iv);wlock(false);rdraw()}
function rnext(sec,ph,n){R.ph=ph;R.left=sec;R.end=Date.now()+sec*1000;bell(n)}
function rtick(){let l=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  if(l!=R.left){R.left=l;if(R.ph=="fight"&&(l==10||(l>0&&l<=3)))beep(l==10?520:700,160)}
  if(l<=0){
    if(R.ph=="fight"){if(R.r>=R.n){R.ph="done";R.run=false;clearInterval(R.iv);wlock(false);bell(3)}else if(R.rest>0)rnext(R.rest,"rest",2);else{R.r++;rnext(R.d,"fight",1)}}
    else if(R.ph=="rest"){R.r++;rnext(R.d,"fight",1)}
  }
  rdraw()}
function rreset(){clearInterval(R.iv);R.run=false;R.ph="idle";R.r=1;R.left=R.d;wlock(false)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&R.run)wlock(true)});


function rfsUpd(){let f=$("#rdfs");if(!f||f.hidden||!$("#fs-t"))return;f.className=(R.ph=="rest"?"rest":"")+(R.ph=="fight"&&R.run&&R.left<=10?" last":"");$("#fs-p").textContent=rph();$("#fs-t").textContent=rfmt(R.left);$("#fs-r").textContent=rrt();$("#fs-go").textContent=rgt()}

function ntf(t,b,tag){let o={body:b,tag:tag,icon:"logo.png",vibrate:[200,100,200]},fb=()=>{try{new Notification(t,o)}catch(e){}};try{navigator.serviceWorker?navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(t,o):fb()).catch(fb):fb()}catch(e){fb()}}
function ntfCheck(){if(!("Notification" in window)||Notification.permission!="granted"||!S||!S.plan)return;let now=new Date(),k=ds(now),L=S.log[k]||{};
  (S.plan[wd(now)]||[]).forEach(x=>{if(!x.h||L[x.id])return;let[hh,mm]=x.h.split(":"),st=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+hh,+mm),mins=Math.round((st-now)/60000);
    if(!(mins>0&&mins<=60))return;let key="nf-n-"+k+"-"+x.id;try{if(localStorage.getItem(key))return;localStorage.setItem(key,"1")}catch(e){}
    ntf(mins>=55?"Treino em 1 hora":"Treino em "+mins+" min",(x.n||x.t)+" às "+x.h,key)})}
setInterval(ntfCheck,30000);setTimeout(ntfCheck,2500);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ntfCheck()});
function Lembretes(){let p="Notification" in window?Notification.permission:"unsupported";
  return `<section class="card"><h3>Lembretes de treino</h3><p class="mu">${p=="granted"?"Aviso ativado neste aparelho: 1 hora antes de cada treino que tem horário.":p=="denied"?"As notificações estão bloqueadas. Libere nas configurações do navegador ou do app.":p=="unsupported"?"Este navegador não suporta notificações.":"Receba um aviso 1 hora antes de cada treino que tem horário."}</p><p class="mu" style="font-size:12px">O aviso só aparece com o app aberto ou em segundo plano. Para tocar sempre, mesmo com o app fechado, use o calendário.</p><div class="row">${p=="default"?'<button class="b pri" data-a="ntf">Ativar avisos</button>':""}<button class="b" data-a="ics">Lembretes no calendário</button></div></section>`}
function icsDate(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"}
function icsText(v){return String(v||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n")}
function icsMake(){let t0=new Date();t0.setHours(0,0,0,0);let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Norte Flow//Treino//PT","CALSCALE:GREGORIAN"],n=0,sk=0,BD=["MO","TU","WE","TH","FR","SA","SU"];
  S.plan.forEach((a,i)=>a.forEach(x=>{if(!x.h){sk++;return}let d=add(mon(t0),i);if(d<t0)d=add(d,7);let[hh,mm]=x.h.split(":"),st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+hh,+mm),en=new Date(st.getTime()+(num(x.d)||60)*60000);n++;
    out.push("BEGIN:VEVENT","UID:"+x.id+"@norteflow","DTSTAMP:"+new Date().toISOString().replace(/[-:]|\.\d+/g,""),"DTSTART:"+icsDate(st),"DTEND:"+icsDate(en),"RRULE:FREQ=WEEKLY;BYDAY="+BD[i],"SUMMARY:"+icsText("Treino: "+(x.n||x.t)),"DESCRIPTION:"+icsText(x.t+(x.o?" - "+x.o:"")),"BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY","DESCRIPTION:Treino em 1 hora","END:VALARM","END:VEVENT")}));
  out.push("END:VCALENDAR");return{txt:out.join("\r\n"),n,sk}}
